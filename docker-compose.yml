# Local Postgres for development and tests.
#
#   docker compose up -d && npm run db:migrate
#
# Port 55432 on purpose: it stays out of the way of any Postgres already
# running on the default 5432.
services:
  postgres:
    image: postgres:17-alpine
    container_name: bidoor-pg
    environment:
      POSTGRES_USER: bidoor
      POSTGRES_PASSWORD: bidoor
      POSTGRES_DB: bidoor
    ports:
      - "55432:5432"
    volumes:
      - bidoor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidoor"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  bidoor-pgdata:
