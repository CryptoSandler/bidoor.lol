<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BIDOOR">
  <!--
    The mark: the doorway IS the podium.

    An arch with a chevron rising inside it. The door and "up only" are the same
    shape rather than two ideas stacked, which is why it survives being shrunk:
    at 16px the arrow still reads. Two colours, flat, no gradient — slime on the
    near-black slate, the only two colours the brand has.
  -->
  <rect width="64" height="64" rx="14" fill="#0F1316"/>
  <path d="M14 58 L14 26 A18 18 0 0 1 50 26 L50 58" fill="none" stroke="#C6FF00"
        stroke-width="8" stroke-linejoin="round"/>
  <path d="M23 40 L32 30 L41 40" fill="none" stroke="#C6FF00" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="34" width="8" height="18" rx="2" fill="#C6FF00"/>
</svg>
